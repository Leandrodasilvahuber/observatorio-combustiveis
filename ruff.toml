# Análise estática do Python (DAG, pipeline, Lambda, scripts e testes).
target-version = "py310"
line-length = 120
extend-exclude = ["dbt", "infra"]

[lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade e bandit (segurança)
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = [
    "E741",  # `l` como "linha" em comprehensions é o padrão do projeto
    "S608",  # SQL montado com f-string só a partir de constantes do código
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert e senhas de teste

[lint.isort]
known-first-party = ["observatorio", "handler"]
